name: Build
on:
  push:
    branches:
      - master
      - branch-*
      - dogfood-*
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}
  queue: ${{ (github.ref_name != github.event.repository.default_branch) && 'single' || 'max' }}

jobs:
  run-python-tests:
    runs-on: ubuntu-latest
    name: Test python scripts
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 #TODO: update to the last version

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Run ruling-diff-comment unit tests
        run: |
          cd ruling-diff-comment
          uv run python -m unittest discover -v -s . -p "test_ruling_diff.py"

      - name: Run pvf-comment unit tests
        run: |
          cd pvf-comment
          python3 -m unittest discover -v -s . -p "test_pvf_comment_parser.py"

  notify-build-failure:
    needs: [run-python-tests]
    if: >-
      always()
      && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/branch-') || startsWith(github.ref, 'refs/heads/dogfood-'))
      && contains(needs.*.result, 'failure')
    runs-on: github-ubuntu-latest-s
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Slack Notification
        uses: SonarSource/core-languages-tooling-public/common-actions/slack-notify@v1
        with:
          slack-channel: squad-corelang-notifs
          branch-patterns: 'master,branch-*,dogfood-*'
          github-token: ${{ github.token }}
          branch: ${{ github.ref_name }}

