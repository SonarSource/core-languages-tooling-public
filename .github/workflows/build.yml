name: Build
on:
  push:
    branches:
      - master
      - branch-*
      - dogfood-*
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}
  queue: ${{ (github.ref_name != github.event.repository.default_branch) && 'single' || 'max' }}

jobs:
  run-python-tests:
    runs-on: sonar-s
    name: Test python scripts
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 #TODO: update to the last version

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Get Artifactory reader token from Vault
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
        id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_ACCESS_TOKEN;

      - name: Run ruling-diff-comment unit tests
        run: |
          cd ruling-diff-comment
          uv run --locked python -m unittest discover -v -s . -p "test_ruling_diff.py"

      - name: Run ruling-diff-comment enhancer unit tests
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
        env:
          UV_INDEX_REPOX_USERNAME: ""
          UV_INDEX_REPOX_PASSWORD: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
        run: |
          cd ruling-diff-comment
          uv run --locked --extra enhancer python -m unittest -v test_enhancer test_models

      - name: Run pvf-comment unit tests
        run: |
          cd pvf-comment
          python3 -m unittest discover -v -s . -p "test_pvf_comment_parser.py"

      - name: Run ruling-update-and-notify unit tests
        run: |
          cd ruling-update-and-notify
          python3 -m unittest discover -v -s . -p "test_ruling_update_scripts.py"

      - name: Run prepare-ruling-artifact unit tests
        run: |
          cd prepare-ruling-artifact
          python3 -m unittest discover -v -s . -p "test_prepare.py"

  notify-build-failure:
    needs: [run-python-tests]
    if: >-
      always()
      && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/heads/branch-') || startsWith(github.ref, 'refs/heads/dogfood-'))
      && contains(needs.*.result, 'failure')
    runs-on: github-ubuntu-latest-s
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Slack Notification
        uses: SonarSource/core-languages-tooling-public/common-actions/slack-notify@v1
        with:
          slack-channel: squad-corelang-notifs
          branch-patterns: ${{ format('{0},branch-*,dogfood-*', github.event.repository.default_branch) }}
          github-token: ${{ github.token }}
          branch: ${{ github.ref_name }}
