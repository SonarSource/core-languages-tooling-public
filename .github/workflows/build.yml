name: Build
on:
  push:
    branches:
      - master
      - branch-*
      - dogfood-*
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  detect-docs-only:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs-only: ${{ steps.detect.outputs.docs-only }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 #TODO: update to the last version
      - id: detect
        uses: ./common-actions/docs-only-changes
        with:
          github-token: ${{ github.token }}

  run-python-tests:
    needs: detect-docs-only
    if: needs.detect-docs-only.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    name: Test ruling-diff-comment action # FIXME: "Test ruling-diff-comment action" -> "Test python scripts"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 #TODO: update to the last version

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Run ruling-diff-comment unit tests
        run: |
          cd ruling-diff-comment
          uv run python -m unittest discover -v -s . -p "test_ruling_diff.py"

      - name: Run pvf-comment unit tests
        run: |
          cd pvf-comment
          python3 -m unittest discover -v -s . -p "test_pvf_comment_parser.py"

  # Configure THIS job (not run-python-tests) as the required status check in branch
  # protection - it always reports a result, even when run-python-tests is skipped for a
  # docs-only change. See common-actions/required-checks-gate/README.md.
  build-required:
    needs: [detect-docs-only, run-python-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 #TODO: update to the last version
      - uses: ./common-actions/required-checks-gate
        with:
          needs-context: ${{ toJSON(needs) }}

