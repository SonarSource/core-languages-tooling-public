name: Build
on:
  push:
    branches:
      - master
      - branch-*
      - dogfood-*
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}
  queue: ${{ (github.ref_name != github.event.repository.default_branch) && 'single' || 'max' }}

jobs:
  run-python-tests:
    runs-on: ubuntu-latest
    name: Test python scripts
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 #TODO: update to the last version

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Run ruling-diff-comment unit tests
        run: |
          cd ruling-diff-comment
          uv run python -m unittest discover -v -s . -p "test_ruling_diff.py"

      - name: Run pvf-comment unit tests
        run: |
          cd pvf-comment
          python3 -m unittest discover -v -s . -p "test_pvf_comment_parser.py"

      - name: Run ruling-update-and-notify unit tests
        run: |
          cd ruling-update-and-notify
          python3 -m unittest discover -v -s . -p "test_ruling_update_scripts.py"

      - name: Run prepare-ruling-artifact unit tests
        run: |
          cd prepare-ruling-artifact
          python3 -m unittest discover -v -s . -p "test_prepare.py"


      - name: Run PVF baseline resolver unit tests
        run: python3 -m unittest discover -v -s pvf-resolve-baseline -p 'test_*.py'

      - name: Run PVF result comment unit tests
        run: python3 -m unittest discover -v -s pvf-result-comment -p 'test_*.py'

      - name: Run PVF Slack notifier unit tests
        run: python3 -m unittest discover -v -s pvf-notify-slack -p 'test_*.py'
