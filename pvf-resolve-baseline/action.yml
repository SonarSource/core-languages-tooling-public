name: 'PVF Resolve Baseline'
description: 'Resolves the PVF baseline of a push to the default branch: the plugin version recorded by prepare-pvf in the previous commit''s Build run, falling back to the newest earlier build that recorded one. Skips the push when its merged PR opts out with the skip-pvf label or [skip pvf] in its title, or when it only changes files matching skip-paths.'

inputs:
  previous-sha:
    description: 'Commit before the push (github.event.before). The plugin version built for it is the baseline.'
    required: true
  current-sha:
    description: 'Commit of the push. Its merged PR is checked for the opt-out, and its own Build run is never used as the baseline.'
    required: false
    default: ${{ github.sha }}
  build-workflow:
    description: 'Filename of the Build workflow that records the candidate-version artifact (see prepare-pvf)'
    required: false
    default: build.yml
  publication-job:
    description: 'Name of the Build job that records the candidate-version artifact, e.g. "Prepare PVF". While the previous commit''s run is in progress, the action waits for this job instead of the whole run. Empty waits for the whole run.'
    required: false
    default: ''
  wait-minutes:
    description: 'How long to wait in total for in-progress Build runs of the previous commit before falling back to an earlier build'
    required: false
    default: '45'
  skip-paths:
    description: 'Extended regex. When every file changed by the push matches it (e.g. rule metadata and docs), the push is skipped. Empty never skips on paths.'
    required: false
    default: ''
  branch:
    description: 'Branch whose Build runs are considered'
    required: false
    default: ${{ github.event.repository.default_branch }}
  token:
    description: 'Token with actions:read, contents:read and pull-requests:read on this repository'
    required: false
    default: ${{ github.token }}

outputs:
  baseline-version:
    description: 'Plugin version to use as the baseline. Empty when the push is skipped or no build recorded a version.'
    value: ${{ steps.resolve.outputs.baseline-version }}
  baseline-sha:
    description: 'Commit the baseline was built from. Differs from previous-sha when the fallback was used.'
    value: ${{ steps.resolve.outputs.baseline-sha }}
  skip-reason:
    description: 'Why no baseline is returned: opt-out (skip-pvf label or [skip pvf] title), skip-paths, or no-baseline. Empty when a baseline was resolved.'
    value: ${{ steps.resolve.outputs.skip-reason }}

runs:
  using: 'composite'
  steps:
    - name: Resolve the baseline
      id: resolve
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PREVIOUS_SHA: ${{ inputs.previous-sha }}
        CURRENT_SHA: ${{ inputs.current-sha }}
        BUILD_WORKFLOW: ${{ inputs.build-workflow }}
        PUBLICATION_JOB: ${{ inputs.publication-job }}
        WAIT_MINUTES: ${{ inputs.wait-minutes }}
        SKIP_PATHS: ${{ inputs.skip-paths }}
        BRANCH: ${{ inputs.branch }}
      run: bash "${{ github.action_path }}/resolve-baseline.sh"
