name: 'Slack Notification'
description: 'Sends a Slack notification summarizing this run''s failed jobs'
author: 'SonarSource'

inputs:
  slack-channel:
    description: 'Slack channel to post the notification to'
    required: true
  branch-patterns:
    description: >-
      Comma-separated list of branch names/patterns to notify for. A trailing '*' matches
      as a prefix (e.g. 'dogfood-*'), otherwise an exact match is required.
    required: false
    default: 'main,master'
  github-token:
    description: 'GitHub token used to query this run''s job details via the GitHub API'
    required: true
  branch:
    description: 'Branch to check against branch-patterns (e.g. github.ref_name)'
    required: true
  conclusion:
    description: >-
      Conclusion to check for failure. Only needed if the caller's job doesn't already
      run exclusively on failure; default 'failure' covers a job gated by `if: failure()`
      or similar.
    required: false
    default: 'failure'

runs:
  using: 'composite'
  steps:
    - name: Determine if notification should be sent
      id: check
      shell: bash
      env:
        BRANCH: ${{ inputs.branch }}
        CONCLUSION: ${{ inputs.conclusion }}
        BRANCH_PATTERNS: ${{ inputs.branch-patterns }}
      run: |
        # Returns success (0) if $1 matches one of the comma-separated branch-patterns.
        # A trailing '*' in a pattern means prefix match; otherwise it's an exact match.
        branch_matches() {
          local branch="$1" pattern patterns
          IFS=',' read -ra patterns <<< "$BRANCH_PATTERNS"
          for pattern in "${patterns[@]}"; do
            pattern="$(echo "$pattern" | xargs)" # trim whitespace
            if [[ "$pattern" == *'*' ]]; then
              [[ "$branch" == "${pattern%\*}"* ]] && return 0
            elif [[ "$branch" == "$pattern" ]]; then
              return 0
            fi
          done
          return 1
        }

        # GitHub's fixed conclusion values that don't count as a failure.
        SUCCESS_CONCLUSIONS=(success neutral skipped)

        SHOULD_NOTIFY=false
        if branch_matches "$BRANCH" && [[ ! " ${SUCCESS_CONCLUSIONS[*]} " =~ " ${CONCLUSION} " ]]; then
          SHOULD_NOTIFY=true
        fi
        echo "should-notify=$SHOULD_NOTIFY" >> "$GITHUB_OUTPUT"

    - name: Vault Secrets
      id: secrets
      if: steps.check.outputs.should-notify == 'true'
      uses: SonarSource/vault-action-wrapper@v3
      with:
        secrets: development/kv/data/slack token | SLACK_TOKEN;

    - name: Job details
      id: failedRun
      if: steps.check.outputs.should-notify == 'true'
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        BRANCH: ${{ inputs.branch }}
        WORKFLOW_NAME: ${{ github.workflow }}
      shell: bash
      run: bash "${{ github.action_path }}/check-run-details.sh"

    - name: Slack Notification
      if: always() && steps.check.outputs.should-notify == 'true'
      shell: bash
      env:
        SLACK_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).SLACK_TOKEN }}
        SLACK_CHANNEL: ${{ inputs.slack-channel }}
        SLACK_MESSAGE: ${{ steps.failedRun.outputs.message }}
      run: bash "${{ github.action_path }}/post-to-slack.sh"