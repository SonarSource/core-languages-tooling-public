name: 'Ruling Update and Notify'
description: 'Commits ruling artifact updates directly to the triggering PR branch and posts a diff comment'
author: 'SonarSource'

inputs:
  ruling-failed:
    description: 'Whether the ruling test failed (true/false)'
    required: true

outputs:
  has-differences:
    description: 'Whether a ruling update was committed (true/false)'
    value: ${{ steps.commit-ruling-update.outputs.update-sha != '' }}
  update-sha:
    description: 'SHA of the ruling commit pushed to the PR branch, empty when none was pushed'
    value: ${{ steps.commit-ruling-update.outputs.update-sha }}

runs:
  using: 'composite'
  steps:
    - name: Validate inputs and PR context
      shell: bash
      env:
        RULING_FAILED: ${{ inputs.ruling-failed }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      run: |
        if [[ "$RULING_FAILED" != true && "$RULING_FAILED" != false ]]; then
          echo "::error::ruling-failed must be true or false"
          exit 1
        fi
        if [[ -z "$PR_NUMBER" ]]; then
          echo "::error::This action requires a pull request event"
          exit 1
        fi
        if [[ "$PR_HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
          echo "::error::This action only supports same-repository pull requests"
          exit 1
        fi

    - name: Check for auto-update loop
      if: inputs.ruling-failed == 'true'
      shell: bash
      run: |
        LAST_COMMIT_MSG=$(git log -1 --format=%B)
        if echo "$LAST_COMMIT_MSG" | grep -q "🤖 Generated with GitHub Actions"; then
          echo "::warning::Last commit was an auto-update, skipping to prevent infinite loop"
          echo "skip-update=true" >> "$GITHUB_ENV"
        else
          echo "skip-update=false" >> "$GITHUB_ENV"
        fi

    - name: Install uv
      if: inputs.ruling-failed == 'true' && env.skip-update == 'false'
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true

    - name: Find ruling directory
      id: ruling-paths
      if: inputs.ruling-failed == 'true' && env.skip-update == 'false'
      shell: bash
      run: python3 "${{ github.action_path }}/find_ruling_directory.py"

    - name: Download ruling artifacts
      id: download-artifacts
      if: inputs.ruling-failed == 'true' && env.skip-update == 'false'
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: actual_*
        path: ${{ runner.temp }}/ruling-artifacts
        # Keep every artifact in its own directory. Merging during extraction
        # can concurrently write the same report from different platforms,
        # resulting in corrupted files when their byte representations differ.
        # The sync step handles isolated artifacts and the flat single-artifact layout.
        merge-multiple: false

    - name: Sync ruling artifacts
      if: inputs.ruling-failed == 'true' && env.skip-update == 'false'
      shell: bash
      env:
        EXPECTED_ROOT: ${{ steps.ruling-paths.outputs.expected-root }}
        ARTIFACT_DIRECTORY: ${{ runner.temp }}/ruling-artifacts
        DOWNLOAD_OUTCOME: ${{ steps.download-artifacts.outcome }}
      run: python3 "${{ github.action_path }}/sync_ruling_artifacts.py"

    - name: Commit ruling update
      id: commit-ruling-update
      if: inputs.ruling-failed == 'true' && env.skip-update == 'false'
      shell: bash
      env:
        TARGET_REF: ${{ github.event.pull_request.head.ref }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        RULING_ROOT: ${{ steps.ruling-paths.outputs.expected-root }}
      run: python3 "${{ github.action_path }}/commit_ruling_update.py"

    - name: Post ruling diff comment
      if: steps.commit-ruling-update.outputs.update-sha != ''
      uses: SonarSource/core-languages-tooling-public/ruling-diff-comment@master
      with:
        pr-number: ${{ github.event.pull_request.number }}
        repository: ${{ github.repository }}
        base-sha: ${{ steps.commit-ruling-update.outputs.update-base-sha }}
        head-sha: ${{ steps.commit-ruling-update.outputs.update-sha }}
        sources-root: ${{ steps.ruling-paths.outputs.sources-root }}
      env:
        GH_TOKEN: ${{ github.token }}
