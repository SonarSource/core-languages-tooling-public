name: 'Ruling Diff Comment'
description: 'Posts a human-readable summary of ruling file changes on PRs'

inputs:
  pr-number:
    description: 'Pull request number'
    required: true
  repository:
    description: 'owner/repo'
    required: true
  base-sha:
    description: 'Base commit SHA for diff'
    required: true
  head-sha:
    description: 'Head commit SHA for diff'
    required: true
  sources-root:
    description: 'Path to sources directory (e.g., its/sources for Java)'
    required: false
    default: 'its/sources'

runs:
  using: 'composite'
  steps:
    - name: Set up uv
      uses: step-security/setup-uv@b49aac5576b90039e3e427495dda1a21aba6aaec # v10.3.3
      with:
        version: "0.13.9"

    - name: Generate and post ruling diff comment
      shell: bash
      env:
        GH_TOKEN: ${{ env.GH_TOKEN }}
        PR_NUMBER: ${{ inputs.pr-number }}
        REPOSITORY: ${{ inputs.repository }}
        BASE_SHA: ${{ inputs.base-sha }}
        HEAD_SHA: ${{ inputs.head-sha }}
        SOURCES_ROOT: ${{ inputs.sources-root }}
        UV_PYTHON_PREFERENCE: only-managed
      run: |
        unset UV_CONFIG_FILE UV_WORKING_DIR
        enhancer_args=()
        if [[ -n "${DSPY_MODEL:-}" ]]; then
          enhancer_args+=(--extra enhancer)
        fi
        uv run --project "${{ github.action_path }}" --python 3.13.17 "${enhancer_args[@]}" python "${{ github.action_path }}/ruling_diff.py" \
          --pr-number "$PR_NUMBER" \
          --repository "$REPOSITORY" \
          --base-sha "$BASE_SHA" \
          --head-sha "$HEAD_SHA" \
          --sources-root "$SOURCES_ROOT"
