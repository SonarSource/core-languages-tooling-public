[project]
name = "ruling-diff-comment"
version = "0.1.0"
description = "GitHub Action helper for ruling diff comments"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
enhancer = [
    "openai>=3.46,<4",
    "pydantic>=2,<3",
]

[tool.uv]
package = false
required-version = ">=0.13.8"
exclude-newer = "5 days"

[[tool.uv.index]]
name = "repox"
url = "https://repox.jfrog.io/artifactory/api/pypi/sonarsource-pypi/simple"
default = true
