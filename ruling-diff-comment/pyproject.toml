[project]
name = "ruling-diff-comment"
version = "0.1.0"
description = "GitHub Action helper for ruling diff comments"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
enhancer = [
    "litellm>=1.106.6,<2",
    "pydantic>=2,<3",
]

[tool.uv]
package = false

[tool.uv.exclude-newer-package]
anyio = "2026-10-31T00:00:00Z"
boto3 = "2026-10-31T00:00:00Z"
botocore = "2026-10-31T00:00:00Z"
litellm = "2026-10-31T00:00:00Z"
openai = "2026-10-31T00:00:00Z"
typing-inspection = "2026-10-31T00:00:00Z"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
