name: Publish test report
description: Upload raw test result files as a build artifact and publish a test report via dorny/test-reporter.

inputs:
  artifact-name:
    description: Name of the artifact to upload the raw test result files under.
    required: true
  results-path:
    description: Path of the raw test result files to upload as an artifact and for dorny/test-reporter to parse.
    required: true
  report-name:
    description: Name shown for the published test report / check run.
    required: true
  reporter:
    description: dorny/test-reporter reporter type.
    required: true
  coverage-artifact-name:
    description: Name of the artifact to upload coverage files under. Omit to skip the coverage upload.
    required: false
    default: ''
  coverage-path:
    description: Path of the coverage files to upload as an artifact. Required if coverage-artifact-name is set.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Save coverage files
      if: ${{inputs.coverage-artifact-name != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.coverage-artifact-name }}
        path: ${{ inputs.coverage-path }}
        retention-days: 14

    - name: Save test results files
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.results-path }}
        retention-days: 14

    - name: Publish test report
      uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
      with:
        name: ${{ inputs.report-name }}
        path: ${{ inputs.results-path }}
        reporter: ${{ inputs.reporter }}
        fail-on-error: 'false'
