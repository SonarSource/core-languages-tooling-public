name: "PVF Notify Slack"
description: "Send a PVF alert with bounded commit and merger attribution"

inputs:
  repository:
    description: "Repository owner/name to query"
    required: false
    default: "${{ github.repository }}"
  token:
    description: "GitHub token with access to the repository"
    required: false
    default: "${{ github.token }}"
  branch:
    description: "Branch used for build selection or merged PR attribution"
    required: false
    default: "${{ github.event.repository.default_branch }}"
  baseline-sha:
    description: "Baseline commit for attribution; empty permits an unattributed alert"
    required: false
    default: ""
  head-sha:
    description: "Candidate commit being validated"
    required: false
    default: "${{ github.sha }}"
  merger-fallback:
    description: "Fallback GitHub login when attribution is unavailable"
    required: false
    default: "${{ github.triggering_actor }}"
  validation-result:
    description: "success, failure or skipped"
    required: true
  baseline-result:
    description: "Baseline resolution job outcome"
    required: true
  new-issues:
    description: "Number of new findings"
    required: false
    default: "0"
  lost-issues:
    description: "Number of lost findings"
    required: false
    default: "0"
  regressed-projects:
    description: "Regressed projects; empty means none"
    required: false
    default: ""
  errored-projects:
    description: "Errored projects; empty means none"
    required: false
    default: ""
  dashboard-url:
    description: "Published dashboard URL"
    required: false
    default: ""
  run-url:
    description: "Workflow run logs URL"
    required: false
    default: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
  slack-webhook:
    description: "Slack incoming webhook; supplied by caller, never logged"
    required: true
  slack-channel:
    description: "Destination Slack channel (webhook must allow channel overrides)"
    required: true
  display-name:
    description: "Slack display name"
    required: false
    default: "Performance Validation"

runs:
  using: composite
  steps:
    - name: PVF Notify Slack
      id: run
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token || github.token }}
        REPOSITORY: ${{ inputs.repository || github.repository }}
        BRANCH: ${{ inputs.branch }}
        BASE_SHA: ${{ inputs.baseline-sha }}
        HEAD_SHA: ${{ inputs.head-sha }}
        MERGER: ${{ inputs.merger-fallback }}
        VALIDATE_RESULT: ${{ inputs.validation-result }}
        RESOLVE_RESULT: ${{ inputs.baseline-result }}
        NEW: ${{ inputs.new-issues }}
        LOST: ${{ inputs.lost-issues }}
        REGRESSED: ${{ inputs.regressed-projects }}
        ERRORED: ${{ inputs.errored-projects }}
        URL: ${{ inputs.dashboard-url }}
        RUN_URL: ${{ inputs.run-url }}
        SLACK_WEBHOOK: ${{ inputs.slack-webhook }}
        SLACK_CHANNEL: ${{ inputs.slack-channel }}
        SLACK_USERNAME: ${{ inputs.display-name }}
      run: python3 "${{ github.action_path }}/notify.py"
