name: 'PVF Result Comment'
description: 'Posts the Performance Validation dashboard, issue counts, and projects with unexpected results as a PR comment; falls back to a run-logs link when no dashboard was published. Works same-repo or cross-repo (analyzer PR).'

inputs:
  pr-number:
    description: 'Pull request number to comment on'
    required: true
  repository:
    description: 'owner/name of the repo whose PR to comment on. Defaults to the current repo (same-repo). Set to the analyzer repo for cross-repo dashboards.'
    required: false
    default: ${{ github.repository }}
  dashboard-url:
    description: 'Published dashboard URL (the validate job pages-url). Empty ⇒ posts the no-dashboard fallback comment.'
    required: false
    default: ''
  new-issues:
    description: 'Number of new issues found'
    required: false
    default: '0'
  lost-issues:
    description: 'Number of lost issues'
    required: false
    default: '0'
  run-url:
    description: 'URL to the workflow run logs (used in the fallback comment). Defaults to this run.'
    required: false
    default: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  token:
    description: 'Token with pull-requests:write on `repository`. Defaults to github.token (same-repo only). For cross-repo, pass a token that can comment on the analyzer repo (e.g. from Vault).'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Download reports artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: "*-results"
        path: ${{ runner.temp }}/pvf-result-comment
        merge-multiple: false

    - name: Find projects with result other than 0, 3 or 4
      id: find-failures
      shell: bash
      env:
        REPORTS_DIR: ${{ runner.temp }}/pvf-result-comment
      run: |
        set -euo pipefail
        projects=''
        # Find the projects whose result is different than 0 (normal), 3 (runtime regression) or 4 (runtime improvement)
        # to report the projects that failed with an unexpected error
        
        if [ -d "$REPORTS_DIR" ]; then
          projects="$(find "$REPORTS_DIR" -type f -name '*.json' -exec jq -r '
            .metadata
            | select((.result | tostring) as $result | ["0", "3", "4"] | index($result) | not)
            | "- \(.name)"
          ' {} + | LC_ALL=C sort -u)"
        fi
        
        # The delimiter allow multi-line value in the GITHUB_OUTPUT
        delimiter="PVF_PROJECTS_${RANDOM}_${RANDOM}_${RANDOM}"
        
        {
          printf 'projects<<%s\n' "$delimiter"
          printf '%s\n' "$projects"
          printf '%s\n' "$delimiter"
        } >> "$GITHUB_OUTPUT"

    - name: Post PVF result on PR
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token || github.token }}
        GH_REPO: ${{ inputs.repository || github.repository }}
        FAILED_PROJECTS: ${{ steps.find-failures.outputs.projects }}
        PR: ${{ inputs.pr-number }}
        URL: ${{ inputs.dashboard-url }}
        NEW: ${{ inputs.new-issues }}
        LOST: ${{ inputs.lost-issues }}
        RUN_URL: ${{ inputs.run-url }}
      run: |
        set -euo pipefail
        if [ -n "$URL" ]; then
          body="📊 **Performance Validation** complete
        🆕 ${NEW:-0} new · 🗑️ ${LOST:-0} lost issues
        [View dashboard](${URL})"
        else
          body="⚠️ **Performance Validation** finished without publishing a dashboard. [See run logs](${RUN_URL})."
        fi
        if [ -n "$FAILED_PROJECTS" ]; then
          body+=$'\n\n'"Projects with unexpected PVF results:"$'\n'"$FAILED_PROJECTS"
        fi
        gh pr comment "$PR" --body "$body"
