name: "PVF Result Comment"
description: "Post PVF results on an explicit PR or the merged PR associated with a commit"

inputs:
  pr-number:
    description: "PR number; takes precedence over commit-sha"
    required: false
    default: ""
  repository:
    description: "Repository owner/name to query"
    required: false
    default: "${{ github.repository }}"
  token:
    description: "GitHub token with access to the repository"
    required: false
    default: "${{ github.token }}"
  dashboard-url:
    description: "Published dashboard URL"
    required: false
    default: ""
  new-issues:
    description: "Number of new findings"
    required: false
    default: "0"
  lost-issues:
    description: "Number of lost findings"
    required: false
    default: "0"
  run-url:
    description: "Workflow run logs URL"
    required: false
    default: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
  validation-result:
    description: "success, failure, skipped or cancelled; empty preserves legacy formatting"
    required: false
    default: ""
  commit-sha:
    description: "Commit used to find a merged PR when pr-number is empty"
    required: false
    default: ""
  branch:
    description: "Branch for merged PR discovery and display; empty accepts any merged PR branch"
    required: false
    default: ""
  skip-reason:
    description: "Explanation for a skipped validation"
    required: false
    default: "No baseline could be resolved."
  regressed-projects:
    description: "Regressed projects; empty means none"
    required: false
    default: ""
  errored-projects:
    description: "Errored projects; empty means none"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: PVF Result Comment
      id: run
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token || github.token }}
        GH_REPO: ${{ inputs.repository || github.repository }}
        PR: ${{ inputs.pr-number }}
        URL: ${{ inputs.dashboard-url }}
        NEW: ${{ inputs.new-issues }}
        LOST: ${{ inputs.lost-issues }}
        RUN_URL: ${{ inputs.run-url }}
        VALIDATE_RESULT: ${{ inputs.validation-result }}
        SHA: ${{ inputs.commit-sha }}
        BRANCH: ${{ inputs.branch }}
        SKIP_REASON: ${{ inputs.skip-reason }}
        REGRESSED: ${{ inputs.regressed-projects }}
        ERRORED: ${{ inputs.errored-projects }}
      run: python3 "${{ github.action_path }}/comment.py"
