# Example workflow for using the pvf-comment action in an analyzer repository.

name: PVF /pvf comment

on:
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [edited]

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: pvf-comment-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  parse-and-trigger:
    name: Parse /pvf and trigger PVF
    if: >
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        contains(github.event.comment.body, '/pvf')
      ) || (
        github.event_name == 'pull_request' &&
        github.event.action == 'edited' &&
        contains(github.event.pull_request.body, '/pvf')
      )
    runs-on: sonar-xs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Parse /pvf comment
        id: pvf
        uses: SonarSource/core-languages-tooling-public/pvf-comment@master
        with:
          comment: ${{ github.event.comment.body || github.event.pull_request.body }}

      - name: Trigger performance validation
        if: steps.pvf.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          RULES_REQUEST: ${{ steps.pvf.outputs.rules-request }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          PREV_BODY: ${{ github.event.changes.body.from || '' }}
        run: python3 .github/scripts/retrigger_pvf.py
