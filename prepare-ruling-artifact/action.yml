name: 'Prepare Ruling Artifact'
description: 'Upload generated ruling results in the layout consumed by ruling-update-and-notify'

inputs:
  actual-root:
    description: 'Generated ruling directory; auto-detected under its/ruling or private/its/ruling when omitted'
    required: false
    default: ''
  artifact-name:
    description: 'Unique artifact name beginning with actual_'
    required: false
    default: 'actual_ruling'

runs:
  using: 'composite'
  steps:
    - name: Stage ruling results
      id: stage
      shell: bash
      env:
        ACTUAL_ROOT: ${{ inputs.actual-root }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: bash "${{ github.action_path }}/prepare.sh"

    - name: Upload ruling results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.stage.outputs.path }}/
        if-no-files-found: error
