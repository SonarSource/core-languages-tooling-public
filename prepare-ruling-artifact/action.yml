name: 'Prepare Ruling Artifact'
description: 'Upload generated ruling results from a test job for a separate update job'

inputs:
  artifact-name:
    description: 'Unique artifact name beginning with actual_'
    required: false
    default: 'actual_ruling'

outputs:
  artifact-id:
    description: 'ID of the uploaded artifact'
    value: ${{ steps.upload.outputs.artifact-id }}
  artifact-url:
    description: 'URL to download the uploaded artifact'
    value: ${{ steps.upload.outputs.artifact-url }}

runs:
  using: 'composite'
  steps:
    - name: Stage ruling results
      id: stage
      shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: |
        if command -v python3 >/dev/null 2>&1; then
          python3 "${{ github.action_path }}/prepare.py"
        else
          python "${{ github.action_path }}/prepare.py"
        fi

    - name: Upload ruling results
      id: upload
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.stage.outputs.path }}/
        if-no-files-found: error

    - name: Report artifact link
      shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
      run: |
        echo "::notice title=Ruling artifact::Uploaded '${ARTIFACT_NAME}': ${ARTIFACT_URL}"
        echo "Ruling artifact \`${ARTIFACT_NAME}\`: ${ARTIFACT_URL}" >> "$GITHUB_STEP_SUMMARY"
