name: 'Prepare Ruling Artifact'
description: 'Upload generated ruling results from a test job for a separate update job'

inputs:
  artifact-name:
    description: 'Unique artifact name beginning with actual_'
    required: false
    default: 'actual_ruling'
  actual-path:
    description: 'Directory containing generated ruling results; defaults to automatic discovery of target/actual or build/actual under its/ruling or private/its/ruling'
    required: false
    default: ''

outputs:
  artifact-id:
    description: 'ID of the uploaded artifact'
    value: ${{ steps.upload.outputs.artifact-id }}
  artifact-url:
    description: 'URL to download the uploaded artifact'
    value: ${{ steps.upload.outputs.artifact-url }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python and uv
      uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      with:
        cache: false
        tool_versions: |
          python 3.13.17
          uv 0.13.9

    - name: Select ruling results
      id: select
      shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        ACTUAL_PATH: ${{ inputs.actual-path }}
      run: |
        uv run --no-project --no-managed-python python "${{ github.action_path }}/prepare.py"

    - name: Upload ruling results
      id: upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.select.outputs.path }}/
        if-no-files-found: error

    - name: Report artifact link
      shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
      run: |
        echo "::notice title=Ruling artifact::Uploaded '${ARTIFACT_NAME}': ${ARTIFACT_URL}"
        echo "Ruling artifact \`${ARTIFACT_NAME}\`: ${ARTIFACT_URL}" >> "$GITHUB_STEP_SUMMARY"
